[project]
name = "trench"
version = "0.1.0"
description = "Procedural 2-minute trench arrangement renderer (CPU only)"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "soundfile", "pyloudnorm", "matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
